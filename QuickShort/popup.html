<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>URL Shortener</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <style>
    body {
      width: 320px;
      padding: 10px;
    }
  </style>
</head>
<body>

  <!-- 탭 메뉴 -->
  <ul class="nav nav-tabs mb-3">
    <li class="nav-item">
      <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#home">
        Home
      </button>
    </li>
    <li class="nav-item">
      <button class="nav-link" data-bs-toggle="tab" data-bs-target="#history">
        History
      </button>
    </li>
  </ul>

  <div class="tab-content">

    <!-- Home -->
    <div class="tab-pane fade show active" id="home">
      <div class="card">
        <div class="card-body">

          <h6 class="card-title mb-3">URL 줄이기</h6>

          <!-- 원본 URL -->
          <input
            type="text"
            id="urlInput"
            class="form-control mb-2"
            placeholder="URL을 입력하세요"
            autocomplete="off"
          />

          <!-- 단축된 URL -->
          <input
            type="text"
            id="shortUrlInput"
            class="form-control mb-3"
            placeholder="단축된 URL"
            readonly
          />

          <!-- 버튼 영역 -->
          <div class="d-flex gap-2">
            <button id="shortenBtn" class="btn btn-primary w-50">
              줄이기
            </button>
            <button id="copyBtn" class="btn btn-outline-secondary w-50">
              Copy
            </button>
          </div>

        </div>
      </div>
    </div>

    <!-- History -->
    <div class="tab-pane fade" id="history">
      <div class="card">
        <div class="card-body">
          <h6 class="card-title mb-3">히스토리</h6>
          <ul class="list-group" id="historyList">
            <li class="list-group-item text-muted">
              아직 히스토리가 없다
            </li>
          </ul>
        </div>
      </div>
    </div>

  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
